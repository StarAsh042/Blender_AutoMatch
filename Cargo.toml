[package]
name = "blender-automatch-core"
version = "1.1.0"
edition = "2021"
# MSRV 按所依赖 PyO3 的 rust-version 实测填写(PyO3 0.30.1 → 1.85)
rust-version = "1.85"
description = "Blender 高低模配对插件 Rust 内核(_core)"
license = "MIT"

[lib]
# 产物为 Python 扩展模块:target/release/_core.dll(复制即 _core.pyd)
name = "_core"
crate-type = ["cdylib"]

[dependencies]
# abi3 稳定 ABI:单个 .pyd 向前兼容各 Blender 内嵌 Python 版本
# 特性最低档以 cargo add 实际解析为准(PyO3 0.30 起不再提供 abi3-py38)
pyo3 = { version = "0.30.1", features = ["abi3-py39"] }
